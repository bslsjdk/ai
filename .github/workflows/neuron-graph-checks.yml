name: Neuron graph Java checks

on:
  pull_request:
    branches: [feat/mobile-neuron-unit-runtime]
  push:
    branches: [feat/scalable-neuron-architecture-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.31.6"

      - name: Install required Android NDK
        run: |
          set -eux
          yes | sdkmanager "ndk;27.0.12077973"
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run neuron graph unit tests and Java compile
        env:
          QNN_INC: ${{ github.workspace }}/qnn_inc
        run: |
          gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac --no-daemon --stacktrace
