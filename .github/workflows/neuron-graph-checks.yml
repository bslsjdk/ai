name: Neuron graph Java checks

on:
  pull_request:
    branches: [feat/mobile-neuron-unit-runtime]
  push:
    branches: [feat/scalable-neuron-architecture-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.31.6"

      - name: Install required Android NDK
        run: |
          set -eux
          yes | sdkmanager "ndk;27.0.12077973"
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"

      - name: Fetch pinned QNN HTP V73 headers and runtime
        run: |
          set -eux
          git clone --depth 1 https://github.com/bslsjdk/npu_probe.git qnn_probe
          cd qnn_probe
          git fetch --depth 1 origin 8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a
          git checkout --detach 8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a
          test "$(git rev-parse HEAD)" = "8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a"
          test -f app/src/main/cpp/qnn_inc/QnnInterface.h
          test -f app/src/main/assets/qnnlibs/libQnnHtp.so
          test -f app/src/main/jniLibs/arm64-v8a/libQnnHtpV73Skel.so

      - name: Stage verified QNN assets into this app build
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/qnnlibs
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtp.so app/src/main/assets/qnnlibs/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpV73Stub.so app/src/main/assets/qnnlibs/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpV73Skel.so app/src/main/assets/qnnlibs/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpV73.so app/src/main/assets/qnnlibs/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnSystem.so app/src/main/assets/qnnlibs/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpPrepare.so.gz app/src/main/assets/qnnlibs/
          {
            echo "npu_probe_commit=8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a"
            echo "source=npu_probe@8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a"
          } > app/src/main/assets/qnn-stack-version.txt
          cat > /tmp/qnn_expected.sha256 <<'EOF'
          ab2c47da90072d3b18c904f5ade34efce32ef27dbee01941e3a9dd17223d76f5  libQnnHtp.so
          d499ebc604319f3214b4197398d2a72203524f5cdd697b9ef90010c181073a49  libQnnHtpPrepare.so.gz
          a0e9f8b303ccd3317be867d1476576593f0f2f00399d505b5664511e726e45ac  libQnnHtpV73.so
          68664240ce331750b0841d62afbb21ff8db6ca723b9c23f3dad894078b481c27  libQnnHtpV73Skel.so
          97c80e62cfe6e10b24860a5a41f3d271cb131b419cee3bf2f8864ed8471109d5  libQnnHtpV73Stub.so
          ec3f3c61e04754645ae2d2d4f97981dfd29d4c91a1b82d3fb4ca40c2c9ab4c37  libQnnSystem.so
          EOF
          (cd app/src/main/assets/qnnlibs && sha256sum -c /tmp/qnn_expected.sha256)
          sha256sum app/src/main/assets/qnnlibs/* > app/src/main/assets/qnn-stack-sha256.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build installable debug APK
        env:
          QNN_INC: ${{ github.workspace }}/qnn_probe/app/src/main/cpp/qnn_inc
        run: |
          set -eux
          gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libornithnpu.so|assets/qnnlibs/libQnnHtp.so|assets/qnnlibs/libQnnHtpV73Skel.so|assets/qnnlibs/libQnnHtpV73Stub.so'
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aimeng-super-neuron-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
