name: AIMENG mobile debug APK

on:
  push:
    branches: [feat/aimeng-mobile-diffusion-runtime]
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/aimeng-mobile-apk.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.31.6 ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch pinned QNN headers required by native build
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/bslsjdk/npu_probe.git qnn_probe
          git -C qnn_probe fetch --depth 1 origin 8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a
          git -C qnn_probe checkout --detach 8fab2ee58cd4ce17ddc18e36a6a7b4992c85c52a
          test -d qnn_probe/app/src/main/cpp/qnn_inc
      - name: Prepare stable public test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aimeng-signing"
          base64 --decode signing/aimeng-test.keystore.b64 > "$RUNNER_TEMP/aimeng-signing/aimeng-test.jks"
          test -s "$RUNNER_TEMP/aimeng-signing/aimeng-test.jks"
          echo "AIMENG_KEYSTORE_PATH=$RUNNER_TEMP/aimeng-signing/aimeng-test.jks" >> "$GITHUB_ENV"
          echo "AIMENG_KEYSTORE_PASSWORD=aimeng-public-test-store-2026" >> "$GITHUB_ENV"
          echo "AIMENG_KEY_ALIAS=aimeng-test" >> "$GITHUB_ENV"
          echo "AIMENG_KEY_PASSWORD=aimeng-public-test-key-2026" >> "$GITHUB_ENV"
          echo "AIMENG_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          echo "Loaded the fixed PUBLIC TEST-ONLY signing key (not for production)."
      - name: Build installable debug APK
        env:
          QNN_INC: ${{ github.workspace }}/qnn_probe/app/src/main/cpp/qnn_inc
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-aimeng-debug.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='bslsjdk.ornithnpu.aimengdebug'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='[0-9]+' versionName='[^']+'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          printf 'stable_signing=%s\nversion_code=%s\n' "$AIMENG_STABLE_SIGNING" "${GITHUB_RUN_NUMBER}" > app/build/outputs/apk/debug/build-info.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aimeng-android-debug-v${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14
