name: AIMENG mobile runtime Java compile check

on:
  push:
    branches: [feat/aimeng-mobile-diffusion-runtime]
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/bslsjdk/ornithnpu/SparseDiffusion*.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/layout/activity_chat.xml"
      - ".github/workflows/aimeng-mobile-check.yml"

permissions:
  contents: read

jobs:
  java-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile Java and Android resources
        run: gradle :app:compileReleaseJavaWithJavac --no-daemon --stacktrace
