plugins { id "com.android.application" }

android {
    namespace "bslsjdk.ornithnpu"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        // Preserve MCNPU's original install identity so an upgraded Ornith build
        // replaces the existing app instead of creating a second app or requiring
        // uninstall. Namespace is intentionally independent from applicationId.
        applicationId "bslsjdk.ornithnpu"
        minSdk 30
        targetSdk 35
        // Bumped every CI build so the APK always installs as an upgrade instead of
        // reporting "same version" and forcing an uninstall. GitHub's run number is
        // monotonic per repo, so it is strictly increasing already: no need to keep a
        // counter anywhere in the tree. Local builds (no env) fall back to the same
        // values as before so nothing else has to know about this.
        // GitHub run numbers increase monotonically, keeping upgrades ahead of prior Ornith builds.
        versionCode ((System.getenv("GITHUB_RUN_NUMBER") ?: "3") as Integer)
        versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
        externalNativeBuild {
            cmake {
                arguments "-DQNN_INC=${System.getenv("QNN_INC") ?: "${rootDir}/qnn_inc"}", "-DANDROID_PLATFORM=android-35"
            }
        }
    }
    buildTypes {
        debug {
            // Keep the experimental AIMENG build installable alongside the existing
            // Ornith/MCNPU app; never replace the user's working app during testing.
            applicationIdSuffix ".aimengdebug"
            versionNameSuffix "-aimeng"
        }
    }
    sourceSets { main { jniLibs.srcDirs = ["src/main/jniLibs"] } }
    packaging { jniLibs { useLegacyPackaging true } }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.6"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
