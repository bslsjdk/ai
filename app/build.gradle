plugins { id "com.android.application" }

android {
    buildFeatures { buildConfig true }
    namespace "bslsjdk.ornithnpu"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        // Preserve the installed Android package identity and signing continuity while
        // changing the launcher from the retired 9B chat flow to the AIMENG neuron lab.
        // Namespace is intentionally independent from applicationId.
        applicationId "bslsjdk.ornithnpu"
        minSdk 30
        targetSdk 35
        // Bumped every CI build so the APK always installs as an upgrade instead of
        // reporting "same version" and forcing an uninstall. GitHub's run number is
        // monotonic per repo, so it is strictly increasing already: no need to keep a
        // counter anywhere in the tree. Local builds (no env) fall back to the same
        // values as before so nothing else has to know about this.
        // GitHub run numbers increase monotonically, keeping upgrades ahead of prior Ornith builds.
        versionCode ((System.getenv("GITHUB_RUN_NUMBER") ?: "3") as Integer)
        versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
        def buildSha = (System.getenv("GITHUB_SHA") ?: "local").take(11)
        buildConfigField "String", "AIMENG_BUILD_SHA", "\\"${buildSha}\\""
        externalNativeBuild {
            cmake {
                arguments "-DQNN_INC=${System.getenv("QNN_INC") ?: "${rootDir}/qnn_inc"}", "-DANDROID_PLATFORM=android-35"
            }
        }
    }
    sourceSets { main { jniLibs.srcDirs = ["src/main/jniLibs"] } }
    packaging { jniLibs { useLegacyPackaging true } }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.6"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
